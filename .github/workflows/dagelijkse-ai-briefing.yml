name: Dagelijkse AI Briefing

on:
  schedule:
    - cron: '0 6 * * 1-5'  # Maandag t/m vrijdag 06:00 UTC = 08:00 CEST / 07:00 CET
  workflow_dispatch:

jobs:
  ai-briefing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Afhankelijkheden installeren
        run: pip install -r requirements.txt

      - name: AI briefing genereren en versturen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: bonheins@gmail.com
        run: python scripts/ai_briefing.py
